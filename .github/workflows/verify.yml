name: Verify environment
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run environment and scenario checks
        run: npm test
      - name: Reproduce benchmark probes
        run: python3 reference/benchmark_audit/reproduce.py
